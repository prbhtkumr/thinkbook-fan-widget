name: qml

on:
  push:
  pull_request:

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt QML tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools
      - name: Parse QML
        run: |
          for file in contents/ui/*.qml contents/config/*.qml; do
            echo "Checking $file"
            qmlformat "$file" > /dev/null
          done
